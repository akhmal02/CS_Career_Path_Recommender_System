{% extends "base.html" %}
{% block title %}Sign in | Career Compass{% endblock %}
{% block content %}
<section class="auth-shell">
    <form method="post" class="auth-card" data-disable-on-submit>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <span class="eyebrow">Welcome back</span>
        <h1>Sign in</h1>
        <label>Email
            <input type="email" name="email" required maxlength="255" autocomplete="email">
        </label>
        <label>Password
            <span class="password-field">
                <input type="password" name="password" required autocomplete="current-password">
                <button class="password-toggle" type="button" aria-label="Show password" data-password-toggle>
                    <span class="eye-icon" aria-hidden="true"></span>
                </button>
            </span>
        </label>
        <button class="button" type="submit">Sign in</button>
        <p><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
        <p>New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
    </form>
</section>
{% endblock %}
