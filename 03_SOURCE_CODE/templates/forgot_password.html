{% extends "base.html" %}
{% block title %}Forgot password | Career Compass{% endblock %}
{% block content %}
<section class="auth-shell">
    <form method="post" class="auth-card" data-disable-on-submit>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <span class="eyebrow">Password recovery</span>
        <h1>Reset your password</h1>
        <p>Enter your registered email. Supabase will send a secure password-reset link if the account exists.</p>
        <label>Email
            <input type="email" name="email" required maxlength="255" autocomplete="email">
        </label>
        <button class="button" type="submit">Send reset link</button>
        <p>Remembered it? <a href="{{ url_for('login') }}">Back to sign in</a></p>
    </form>
</section>
{% endblock %}
