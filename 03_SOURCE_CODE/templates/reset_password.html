{% extends "base.html" %}
{% block title %}Set new password | Career Compass{% endblock %}
{% block content %}
<section class="auth-shell">
    <form method="post" class="auth-card" data-reset-password-form data-disable-on-submit>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="access_token" data-reset-access-token>
        <input type="hidden" name="refresh_token" data-reset-refresh-token>
        <span class="eyebrow">Secure reset</span>
        <h1>Create a new password</h1>
        <p data-reset-status>Open this page from your Supabase password-reset email, then enter a new password.</p>
        <label>New password
            <span class="password-field">
                <input type="password" name="password" required minlength="8" autocomplete="new-password">
                <button class="password-toggle" type="button" aria-label="Show password" data-password-toggle>
                    <span class="eye-icon" aria-hidden="true"></span>
                </button>
            </span>
        </label>
        <label>Confirm new password
            <span class="password-field">
                <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
                <button class="password-toggle" type="button" aria-label="Show password" data-password-toggle>
                    <span class="eye-icon" aria-hidden="true"></span>
                </button>
            </span>
        </label>
        <button class="button" type="submit">Update password</button>
        <p><a href="{{ url_for('forgot_password') }}">Request a new reset link</a></p>
    </form>
</section>
{% endblock %}
